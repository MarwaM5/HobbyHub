<template data-hh-scene="signup-room">
  <div class="hhAuthScene hhSignupRoom hhHobbyStudio" aria-hidden="true">
    <img
      class="hhArtistRoom"
      src="../../animation/assets/studio-signup-room.webp"
      alt=""
      decoding="async"
      width="1086"
      height="1448"
    />
    <span class="hhRoomSunbeam"></span><span class="hhRoomGlints"></span
    ><span class="hhStudioLamp"></span>
    <div class="hhAuthDepthStage" id="hhSignupDepthStage">
      <span class="hhStudioSpeech">Your creative corner is waiting.</span>
      <div class="hhStudioCat">
        <div class="hhStudioCatBody">
          <span class="hhStudioCatPose" style="--cat-x: 0%; --cat-y: 0%"></span
          ><span class="hhStudioCatPose" style="--cat-x: 50%; --cat-y: 0%"></span
          ><span class="hhStudioCatPose" style="--cat-x: 100%; --cat-y: 0%"></span
          ><span class="hhStudioCatPose" style="--cat-x: 0%; --cat-y: 100%"></span
          ><span class="hhStudioCatPose" style="--cat-x: 50%; --cat-y: 100%"></span
          ><span class="hhStudioCatPose" style="--cat-x: 100%; --cat-y: 100%"></span>
        </div>
      </div>
      <span class="hhStudioCamera"></span><span class="hhStudioBrush"></span
      ><i class="hhStudioRuleSpark" style="--spark-index: 0"></i
      ><i class="hhStudioRuleSpark" style="--spark-index: 1"></i
      ><i class="hhStudioRuleSpark" style="--spark-index: 2"></i
      ><i class="hhStudioRuleSpark" style="--spark-index: 3"></i>
    </div>
  </div>
</template>
